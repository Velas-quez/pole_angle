# Hydra configuration for TactileMLP parameters with _target_
_target_: src.models.TactileMLPVector

activation:
  _target_: torch.nn.ReLU # Example: torch.nn.ReLU, torch.nn.SiLU
  _partial_: true
dropout: 0.1             # Dropout rate
normalization:
  _target_: torch.nn.BatchNorm1d # Example: torch.nn.BatchNorm1d, torch.nn.LayerNorm
  _partial_: true
# num_layers: 4            # Number of layers
neurons: [256, 128, 128, 64, 32] # List of neurons per layer, length matches num_layers

