defaults:
  - _self_
  - models: dummy
  - strategies: dummy_strategy
  - targets: vector

experiment_name: "Pole_Orientation_Dummy_Z_Axis_001"
use_gpu: true
resume_run_id: null

data:
  processed_dir:
    train: "data/train/processed/"
    test: "data/test/processed/"
  pre_processed:
    train:
      evtac: "data/train/preprocessed_mix/evtac.parquet"
      markers: "data/train/preprocessed_mix/markers.parquet"
      opti: "data/train/preprocessed_mix/optitrack.parquet"
    test:
      evtac: "data/test/preprocessed/evtac.parquet"
      markers: "data/test/preprocessed/markers.parquet"
      opti: "data/test/preprocessed/optitrack.parquet"

training:
  batch_size: 128
  epochs: 1
  use_gpu: true # Replaces the 'cuda' if check in code
  scale_evtac: true
  split_ratio: 0.10
  optimizer:
    _target_: src.utils.dummy_optimizer.DummyOptimizer # Optimizer: AdamW
  criterion:
    _target_: torch.nn.CosineEmbeddingLoss # Loss function: CosineEmbeddingLoss
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: 'min'      # Queremos que o LR caia quando a loss parar de diminuir
    factor: 0.5      # Corta o LR pela metade
    patience: 6   


test:
  # 1. Copy the Run ID from your MLflow UI here
  run_id: "d0c0747e37f64cb9a93a0aaa6a510a12" 
  
  # 2. Where the graphs will be saved
  output_dir: "results/test_plots/${test.run_id}"
  
  visuals:
    save_plots: true
    show_plots: true # Set to false if running on a server without a display
