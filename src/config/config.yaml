# conf/config.yaml

defaults:
  - _self_
  - models: lstm_config # This points to conf/models/feat_lstm.yaml
  - strategies: sliding_window_quads_strategy # This points to conf/strategies/sliding_window.yaml
  - targets: vector 

experiment_name: "Pole_Balancing_LSTM_Vector"
use_gpu: true
resume_run_id: null

data:
  processed_dir:
    train:  "data/train/processed/"
    test:  "data/test/processed/"
  pre_processed:
    train:
      evtac: "data/train/preprocessed/evtac.parquet"
      markers: "data/train/preprocessed/markers.parquet"
      opti: "data/train/preprocessed/optitrack.parquet"

    test:
      evtac: "data/test/preprocessed/evtac.parquet"
      markers: "data/test/preprocessed/markers.parquet"
      opti: "data/test/preprocessed/optitrack.parquet"


training:
  batch_size: 128
  epochs: 500
  use_gpu: true # Replaces the 'cuda' if check in code
  scale_evtac: true
  optimizer:
    _target_: torch.optim.AdamW # Optimizer: AdamW
    lr: 0.002                 # Learning rate
    weight_decay: 0.02        # Regularization factor
  criterion:
    _target_: torch.nn.CosineEmbeddingLoss # Loss function: CosineEmbeddingLoss
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: 'min'      # Queremos que o LR caia quando a loss parar de diminuir
    factor: 0.5      # Corta o LR pela metade
    patience: 6     
