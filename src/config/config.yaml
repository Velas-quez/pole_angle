# conf/config.yaml

defaults:
  - _self_
  - models: feat_mlp  # This points to conf/models/feat_mlp.yaml

experiment_name: "Pole_Balancing_MLP_v1"
use_gpu: true
resume_run_id: null

data:
  evtac: "data/raw/evtac.parquet"
  markers: "data/raw/markers.parquet"
  opti: "data/raw/optitrack.parquet"

training:
  batch_size: 128
  epochs: 200
  use_gpu: true # Replaces the 'cuda' if check in code
  optimizer:
    _target_: torch.optim.AdamW # Optimizer: AdamW
    lr: 0.001                 # Learning rate
    weight_decay: 0.01        # Regularization factor
  criterion:
    _target_: torch.nn.CosineEmbeddingLoss # Loss function: CosineEmbeddingLoss
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: 'min'      # Queremos que o LR caia quando a loss parar de diminuir
    factor: 0.5      # Corta o LR pela metade
    patience: 10     # Espera 10 épocas sem melhora
    verbose: true
