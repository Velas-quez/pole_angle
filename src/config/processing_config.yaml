# conf/processing_config.yaml
defaults:
  - _self_
  - strategies: sliding_window_quads # This points to conf/strategies/sliding_window.yaml

# Diretórios de Entrada
input:
  dir: "data/train/preprocessed/"
  evtac: "evtac.parquet"
  markers: "markers.parquet"
  opti: "optitrack.parquet"

# Diretório de Saída
output:
  base_dir: "data/train/processed/"

# Se quiser processar múltiplos de uma vez (opcional)
force_reprocess: false
